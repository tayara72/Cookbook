<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooksie</title>
  <style>
    :root {
      --blue: #1f56b5;
      --background: #f2f3f8;
      --text: #121212;
      --secondary: #666872;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    .app-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 24px;
      border-radius: 22px;
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: white;
    }

    h1 {
      font-size: 52px;
      margin: 0 0 12px;
      letter-spacing: -1.5px;
    }

    .tagline {
      color: var(--secondary);
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 38px;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 32px;
      text-align: left;
      box-shadow: 0 3px 18px rgba(0, 0, 0, 0.04);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    .card p {
      color: var(--secondary);
      line-height: 1.6;
      font-size: 17px;
      margin: 0 0 24px;
    }

    .button {
      display: inline-block;
      background: var(--blue);
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 17px;
    }

    footer {
      color: var(--secondary);
      margin-top: 34px;
      font-size: 14px;
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 42px;
      }

      .tagline {
        font-size: 18px;
      }

      .card {
        padding: 25px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="app-icon">🍴</div>
    <h1>Cooksie</h1>
    <p class="tagline">
      Your personal recipe cabinet for saving, organizing, and enjoying the recipes you love.
    </p>

    <section class="card">
      <h2>Need help?</h2>
      <p>
        Visit the Cooksie support page for assistance with saving recipes,
        importing content, favorites, or backup and restore.
      </p>
      <a class="button" href="support.html">Cooksie Support</a>
    </section>

    <footer>
      © 2026 Cooksie. All rights reserved.
    </footer>
  </main>
</body>
</html>
